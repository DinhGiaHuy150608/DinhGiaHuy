<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ cá</title>
    <link rel="stylesheet" href="../style.css"/>
    <link rel="stylesheet" href="hoca.css"/>
</head>
<body>
    <h2>Đinh Gia Huy - 52.01.104.032</h2>
    <div id="mattroi"></div>

    <div id="hoca">
        <img class="cacon" src="cacon.png"/>

        <img id="ca" src="shark.webp"/>

        <div class="bong" id="b1"></div>
        <div class="bong" id="b2"></div>
        <div class="bong" id="b3"></div>
        <div class="bong" id="b4"></div>
        <div class="bong" id="b5"></div>
        <div class="bong" id="b6"></div>

        <div class="rong" id="r1"></div>
        <div class="rong" id="r2"></div>
        <div class="rong" id="r3"></div>
        <div class="rong" id="r4"></div>
        <div class="rong" id="r5"></div>

        <div id="cat"></div>
    </div>
    
    <audio id="nhac" src="Baby Shark.mp3" loop></audio>
    <button id="nutnhac" onclick="batTatNhac()">🔇</button>

    <script>
        var nhac = document.getElementById("nhac");
        var nut = document.getElementById("nutnhac");

        function batTatNhac(){
            if (nhac.paused){
                nhac.play();
                nut.textContent = "🎵";
            } else {
                nhac.pause();
                nut.textContent = "🔇";
            }
        }
    </script>
</body>
</html>
